name: Build itch.io zip
on:
  push:
    branches: [main]
    paths: ['public/**', 'server/**', 'worker/**', 'scripts/**', 'docs/**', 'package*.json', 'wrangler.toml', '.github/workflows/build-itch.yml']
  workflow_dispatch:
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Stamp Worker build identity
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/stamp-release.mjs
      - run: npx wrangler deploy --dry-run --outdir .wrangler/online-build
      - run: npm run build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: ashfall-release
          path: dist/*
