name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', 'server/**', 'public/js/**', 'tests/**', 'package.json', 'package-lock.json', 'wrangler.toml', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          vars: |
            RELEASE_SHA
      - name: Verify deployed online authority
        env:
          ASHFALL_EXPECTED_RELEASE: ${{ github.sha }}
          ASHFALL_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node tests/deployment-smoke.mjs
